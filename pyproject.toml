[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prose"
version = "0.1.0"
description = "Project JusticeStack / LexGlasses: pro se litigation assistant pipeline (ingestion, claim matching, doc generation, glasses HUD)"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
glasses = ["websockets", "vosk", "sounddevice"]

[project.scripts]
prose = "prose.cli:main"

[tool.setuptools.packages.find]
include = ["prose*"]

[tool.setuptools.package-data]
prose = ["data/templates/*.txt", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# inline HTML/CSS/JS template strings; wrapping them hurts readability more than it helps
"prose/web.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]